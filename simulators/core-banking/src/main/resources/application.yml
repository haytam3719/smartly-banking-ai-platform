server:
  port: ${SERVER_PORT:8090}
  shutdown: graceful
spring:
  application:
    name: core-banking-simulator
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/core_banking}
    username: ${DB_USERNAME:core_banking}
    password: ${DB_PASSWORD:local-only-password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
internal-auth:
  dev-mode: ${INTERNAL_AUTH_DEV_MODE:false}
  api-key: ${INTERNAL_AUTH_API_KEY:}
simulator:
  faults:
    enabled: ${SIMULATOR_FAULTS_ENABLED:false}
    max-latency-ms: ${SIMULATOR_MAX_LATENCY_MS:5000}
