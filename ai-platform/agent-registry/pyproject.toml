[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "smartly-agent-registry"
version = "0.1.0"
description = "Capability registry for Smartly AI domain agents"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.115.5",
  "pydantic==2.10.2",
  "uvicorn[standard]==0.32.1",
  "PyYAML==6.0.2",
  "httpx==0.27.2",
  "python-json-logger==3.2.1"
]

[project.optional-dependencies]
test = ["pytest==8.3.3", "pytest-asyncio==0.24.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_registry"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

