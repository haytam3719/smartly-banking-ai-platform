server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
spring:
  application:
    name: mobile-bff
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
mobile-bff:
  authentication:
    demo-mode: ${MOBILE_AUTH_DEMO_MODE:true}
  orchestrator:
    base-url: ${AI_ORCHESTRATOR_URL:http://ai-orchestrator:8080}
    connect-timeout: ${ORCHESTRATOR_CONNECT_TIMEOUT:500ms}
    read-timeout: ${ORCHESTRATOR_READ_TIMEOUT:30s}
    retry-attempts: ${ORCHESTRATOR_RETRY_ATTEMPTS:2}
